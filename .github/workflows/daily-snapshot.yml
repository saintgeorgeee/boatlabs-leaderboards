name: Update BoatLabs WR leaderboard

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Fetch fresh BoatLabs data (disable to rebuild from the last published snapshot)"
        required: false
        default: true
        type: boolean
  schedule:
    # Once per day at 02:00 GMT (UTC).
    - cron: "0 2 * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build daily snapshot
        if: ${{ inputs.refresh_data != false }}
        run: npm run build
      - name: Restore last published snapshot
        if: ${{ inputs.refresh_data == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-snapshot.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          artifact_url="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .archive_download_url' | head -n 1)"
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" "${artifact_url}" -o pages.zip
          unzip -p pages.zip artifact.tar | tar --extract --no-same-owner
          node scripts/rebuild-from-cache.mjs performance/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
